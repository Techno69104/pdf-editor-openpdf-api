services:
  - type: web
    name: pdf-editor-openpdf-api
    runtime: java
    plan: free
    region: oregon
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/pdf-editor-openpdf-api-1.0.0.jar
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: RENDER_EXTERNAL_URL
        value: https://pdf-editor-openpdf-api.onrender.com
